apis:
- aid: aeropay:aeropay-webhooks
  name: Aeropay Webhooks
  description: >-
    Outbound HTTPS webhook deliveries covering nine topics across the ACH, RfP and RTP rails — transaction_completed,
    transaction_voided, transaction_refunded, transaction_declined, transaction_resolved, preauthorized_transaction_created,
    user_suspended, user_active and merchant_reputation_updated. Subscriptions are created with POST /v2/webhook;
    payloads carry payloadVersion 2.0. Aeropay retries up to five times with exponential backoff and jitter
    when a callback fails to answer 200 within 3000ms. Aeropay publishes no AsyncAPI document; the catalog
    below is derived from its webhook documentation.
  humanURL: https://dev.aero.inc/docs/webhooks-1
  baseURL: https://api.aeropay.com/v2
  tags:
  - Webhook
  - Payments
  - ACH
  properties:
  - type: Webhooks
    url: asyncapi/aeropay-webhooks-asyncapi.yml
  - type: Documentation
    url: https://dev.aero.inc/docs/webhooks-1
  - type: Documentation
    url: https://dev.aero.inc/docs/webhook-security
- aid: aeropay:aeropay-mcp
  name: Aeropay API MCP Server
  description: >-
    A remote Model Context Protocol server hosted by Aeropay at https://dev.aero.inc/mcp, documented for
    Cursor, Windsurf and Claude Desktop. Anonymous tools/list returns four spec-driven tools — list-endpoints,
    get-endpoint, search-endpoints and execute-request — that read the Aeropay v2 OpenAPI and can execute
    a live API request from a HAR request object when the caller supplies their own Aeropay credentials.
  humanURL: https://dev.aero.inc/docs/mcp
  baseURL: https://dev.aero.inc/mcp
  tags:
  - MCP
  - Payments
