aid: aeropay
name: Aeropay
description: 'Aeropay is a Chicago-based fintech operating a pay-by-bank network that moves money directly
  between consumer bank accounts and merchants over ACH, Request for Payment (RfP) and RTP rails, without
  cards. The product suite is Aerosync (branded bank linking and account connectivity), Pay (merchant
  acceptance of bank payments), Payout (real-time merchant-to-consumer credits) and Guard (risk decisioning
  and fraud prevention). Integrators use the Aeropay v2 REST API — a 32-operation OpenAPI 3.0.0 contract
  covering token issuance, user creation and MFA confirmation, bank linking through an aggregator widget,
  standard, preauthorized, payout and reversal transactions, transaction search, payment links, webhook
  subscriptions, reporting and merchant reputation — alongside first-party Aerosync bank-linking SDKs for
  web, React Native, Android, iOS and Flutter. Aeropay publishes a documentation llms.txt, a remote MCP
  server for the API reference, a nine-topic webhook catalog, a 91-entry error glossary, a NACHA ACH return-code
  glossary and a substantial sandbox exception-scenario harness. It is SOC 2 compliant and audits its ACH
  operations annually against NACHA standards.'
