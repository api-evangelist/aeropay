apis:
- aid: aeropay:aeropay-v2-api
  name: Aeropay v2 API
  description: The Aeropay v2 REST API for pay-by-bank money movement. Issue merchant- or userForMerchant-scoped
    bearer tokens, create and confirm users, obtain Aerosync bank-linking credentials and attach the resulting
    account, then create standard, preauthorized or payout transactions, capture or reverse them, search
    transactions, send payment links, subscribe to webhooks, pull CSV/totals/batch reports and manage merchant
    reputation. 32 operations over 26 paths, described by a published OpenAPI 3.0.0 document.
  humanURL: https://dev.aero.inc/docs/getting-started
  baseURL: https://api.aeropay.com/v2
  tags:
  - Payments
  - Pay by bank
  - ACH
  - Payouts
