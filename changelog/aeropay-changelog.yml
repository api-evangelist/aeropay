scheme: sdk-release-notes
note: 'Aeropay publishes NO changelog for the v2 REST API itself. The two "Release Notes" pages under the
  docs cover only the Aerosync bank-linking SDKs — one page for the Web SDK, one for the React Native SDK.
  There is no dated log of API contract changes, no deprecation notices and no per-release diff of the
  OpenAPI. This is the single largest operational-transparency gap in the profile: the contract changed
  materially in 2026 (multiple independent reversals replacing silently-merged partial refunds, the
  Idempotency-Key surface, the AP13XX refund codes, the tipConfiguration endpoint, payloadVersion 2.0
  webhooks with merchantUserReputation) and every one of those changes is documented only inside the
  affected reference page''s prose, never announced in a dated entry.'
