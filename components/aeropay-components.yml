- url: https://github.com/Aeropay-inc/test-aerosync-capacitor
  description: Capacitor example; see https://dev.aero.inc/docs/capacitor-aeronetwork.
summary:
  component_families: 3
  embeddable_surfaces: 3
  headless_alternative: false
  headless_note: 'There is no headless bank-linking path. Every account link goes through the Aerosync
    widget, so an integrator cannot collect routing and account numbers directly through the Aeropay API.'
