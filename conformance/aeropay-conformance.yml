standards:
- id: nacha-ach
  name: Nacha ACH Operating Rules
  conforms: true
  domain_standard: true
  sector: payments
  evidence: 'Aeropay states on its trust center: "We handle ACH operations in strict compliance with NACHA
    standards, and undergo annual independent audits of our ACH processes." The CONTRACT carries the
    signature independently of the marketing claim: the transaction-status reference publishes the full
    70-entry NACHA R-code registry as the return-code glossary for declined transactions, and the
    `returnCode` / `scenarioReturnCode` fields carry those codes on the wire. See
    errors/aeropay-decline-codes.yml.'
  evidence_url: https://dev.aero.inc/docs/transaction-status
- id: soc2
  name: SOC 2
  conforms: true
  evidence: '"Aeropay is SOC 2 compliant, with annual independent audits verifying that our security,
    availability, and confidentiality controls meet enterprise-grade standards." No report type (Type I
    vs Type II) or audit period is published, and no report is downloadable.'
  evidence_url: https://www.aeropay.com/trust-center
- id: rtp-tch
  name: RTP / Request for Payment (The Clearing House real-time rails)
  conforms: true
  evidence: 'The webhook topic table declares three payment rails per topic — ACH, RfP and RTP — and the
    transaction object carries an `isRtp` boolean. A dedicated Request for Payment transaction guide is
    published at https://dev.aero.inc/docs/request-for-payment-transaction. Error AP1305 ("RTP transaction
    cannot be voided - schedule a refund") shows the rail distinction is enforced in the contract.'
  evidence_url: https://dev.aero.inc/docs/webhooks-1
- id: fdx
  name: FDX (Financial Data Exchange)
  conforms: false
  partial: true
  evidence: 'The trust center references "FDX-style normalization" of bank data — a stylistic alignment
    claim, not a conformance claim. Aeropay publishes no FDX API surface, no FDX resource shapes and no
    certification. Recorded as NOT conforming so the softer claim is not credited as adoption.'
  evidence_url: https://www.aeropay.com/trust-center
- id: oauth2
  name: OAuth 2.0
  conforms: false
  evidence: 'The OpenAPI declares an EMPTY components.securitySchemes object; there is no oauth2 scheme,
    no authorization endpoint and no token-scope string. Aeropay''s own "scopes" (merchant /
    userForMerchant) are an actor selector on a credentials-exchange endpoint, not OAuth scopes. Aeropay
    describes Aerosync as "OAuth-first bank linking", but that OAuth is between the END USER and THEIR
    BANK inside the widget — it is not an authorization model this API exposes to integrators.'
- id: oidc
