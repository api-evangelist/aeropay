aeropay_decline_codes:
- code: AP109
  meaning: User is suspended from global reputation
  action: The user should email <support@aeropay.com> to confirm a resolution to enable their account.
  buyer_message: We've detected delinquent activity on your account. Reach out to <support@aeropay.com>  to reactivate
    your account.
- code: AP110
  meaning: User is missing required info to transact
  action: Verify user has valid first and last names, email and phone number
  buyer_message: Your profile is incomplete. Please contact <support@aeropay.com>  to finish setting up before completing
    this transaction.
- code: AP114
  meaning: User is blocked from transacting at this merchant
  action: Direct the user to contact the merchant to reactivate their account.
  buyer_message: Your account has been restricted. The activity on the account may have violated the merchant's
    community standards. Please contact the merchant to reactivate your account.
- code: AP302
  meaning: Insufficient Funds
  action: The user’s current balance does not meet the transaction amount. Pending transactions in the user’s account
    may be impacting the total available balance. The user must deposit additional funds into their connected account.
    (This may take 1-2 business days to be reflected)
  buyer_message: We could not approve your payment. Your available balance might be insufficient for this transaction.
    Please add more funds to your account or contact support@aeropay.com for more information."\
- code: AP303
  meaning: Transaction Missing Location
  action: The transaction request is missing the location code required to complete the payment. Please reach out
    to Aeropay for assistance.
  buyer_message: Transaction missing location.
- code: AP304
  meaning: Amount exceeds maximum limit for merchant
  action: The requested transaction amount exceeds the daily limit on your merchant account. Please reach out to
    Aeropay for assistance.
  buyer_message: '''Transaction amount {amount} exceeds limit.'''
- code: AP305
  meaning: User is suspended from global reputation
  action: 'Specific to /payoutTransaction: The user should email support@aeropay.com to confirm a resolution to
    enable their account.'
  buyer_message: We've detected delinquent activity on your account. Reach out to support@aeropay.com to reactivate
    your account."\
- code: AP306
  meaning: Balance does not meet requirement
  action: The user's available bank account balance is insufficient to cover the transaction. The user must deposit
    additional funds into their connected account. (This may take 1-2 business days to be reflected)
  buyer_message: \_"We could not approve your payment. Your available balance might be insufficient for this transaction.
    Please add more funds to your bank account or contact support@aeropay.com for more information".\
- code: AP307
  meaning: Transaction Not Approved
  action: Aeropay’s machine learning model did not approve the transaction after assessing its likelihood to decline.
    The user may contact the Aeropay Team for a possible override at support@aeropay.com
  buyer_message: We could not approve your payment. Please try a lower amount or contact your financial institution
- code: AP308
  meaning: Invalid amount
  action: The amount submitted for the transaction does not match a standard monetary format. Please retry the amount
    with a limit of two decimal places.
  buyer_message: '''Invalid amount: {reason}'''
- code: AP310
  meaning: Credit transaction was declined
  action: The transaction request was malformed. Please reach out to Aeropay for assistance.
  buyer_message: We're sorry, your transaction request has been declined.
- code: AP315
  meaning: Guardrail reject
  action: This transaction was rejected by Aeropay's guardrails. Please contact Aeropay for more information.
  buyer_message: We could not approve your payment. You've reached the permitted threshold or are using a bank that
    is suspended. Adjust your payment, bank account, or try again later.
- code: AP400
  meaning: User has no banks connected and cannot transact
  action: Connect a bank account for user
  buyer_message: Connect your bank account to initiate a transaction.
- code: AP402
  meaning: Merchant bank account invalid
  action: Your merchant account may not have a valid bank account. Reach out to your Aeropay representative.
  buyer_message: No bank account for merchant id {merchant}.
- code: AP403
  meaning: Blocked routing number
  action: The users's bank account has been disabled for security purposes. Try again later.
  buyer_message: Sorry, your bank is not supported at this time. Please connect to a different account. Questions?
    Contact<support@aeropay.com> .
- code: AP404
  meaning: Routing number provided does not pass validation
  action: Confirm valid routing number.
  buyer_message: We could not validate your routing number.
- code: AP411
  meaning: Invalid account type
  action: User may have connected a non-checking account. Ensure checking account is linked.
  buyer_message: Invalid account connected for processing payments. Please connect a checking account.
- code: AP412
  meaning: Bank account has been removed from users account
  action: Provide valid bankAccountId or remove bankAccountId param and transaction will use user's default bank
    account
  buyer_message: This account has already been removed..
sandbox_triggers:
  docs: https://dev.aero.inc/docs/testing
  mechanism: Pass an `exceptionScenario` string in the POST /v2/transaction body in sandbox.
  return_scenarios:
  - exceptionScenario: returnInsufficient
    produces: R01
    meaning: Insufficient funds decline
  - exceptionScenario: returnAccount
    produces: R02
    meaning: Account issue decline
  - exceptionScenario: returnDispute
    produces: R07
    meaning: Dispute decline
  rejection_scenarios:
  - exceptionScenario: delinquent
    produces: AP109
    meaning: User rejected for outstanding declined payments or a bad bank account
  - exceptionScenario: riskEngine
    produces: AP307
    meaning: Risk engine rejects the payment
  - exceptionScenario: balanceInsufficient
    produces: AP302
    meaning: User has insufficient funds to cover the total
  side_effect: Triggering a decline scenario suspends the sandbox user until the payment is resolved from the merchant
    portal.
transaction_statuses:
- portal: Pending
  internal: pending
  meaning: Approved and processing. Aeropay guarantees these funds; the merchant may treat them as successful.
  webhook: transaction_completed
- portal: Complete
  internal: processed
  meaning: Batched and debited successfully.
  webhook: null
- portal: Refunded
  internal: processed
  meaning: Processed, then reversed by a new merchant-to-user transaction.
  webhook: transaction_refunded
- portal: Void
  internal: void
  meaning: Stopped before batching; the user account was never debited.
  webhook: transaction_voided
- portal: Resolved
  internal: resolved
  meaning: Previously declined, then successfully recovered from the user account.
  webhook: transaction_resolved
- portal: Declined
  internal: declined
  meaning: Resulted in an ACH return. Aeropay recovery attempts to collect.
  webhook: transaction_declined
payment_types:
- paymentType: payment
  meaning: Consumer debit
- paymentType: payment+
  meaning: Consumer debit with a tip
- paymentType: payout
  meaning: Consumer credit
- paymentType: reversal
  meaning: Consumer credit for a prior debit
