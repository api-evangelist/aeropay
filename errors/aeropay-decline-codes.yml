domain_standard:
  id: nacha-ach-return-codes
  body: Nacha
  conforms: true
  evidence: Aeropay publishes the NACHA R-code registry verbatim as its return-code glossary and states "These 'r-codes'
    are standardized by NACHA, the governing body for the ACH network." Return codes surface on the wire as the
    `returnCode` field on a declined transaction and, in sandbox, as `scenarioReturnCode` on an exceptionScenario
    transaction.
envelope:
  declined_transaction_field: returnCode
  sandbox_field: scenarioReturnCode
  delivery: Return codes reach the integrator on the transaction_declined webhook topic, which Aeropay documents
    as carrying ACH return codes.
  note: An ACH return is asynchronous. POST /v2/transaction returns HTTP 200 with status "pending"; the return code
    arrives days later on the webhook, never on the original response.
masking:
  to_buyer: Aeropay does not publish a masking policy for return codes. The consumer-facing error MESSAGES in the
    AP glossary are written for display to the end user (e.g. AP302 "You have insufficient funds..."), while the
    NACHA R-codes carry bank-internal detail (R05 unauthorized corporate debit, R07 revoked authorization, R10 not
    authorized to debit) that is not written for consumer display. Whether Aeropay surfaces the raw R-code to buyers
    is not stated.
  documented: false
summary:
  ach_return_code_count: 70
  aeropay_decline_code_count: 18
  rails:
  - ACH
  - RfP
  - RTP
  note: Two distinct families. The R-codes are the NACHA network returns that arrive after settlement. The AP3XX/AP4XX
    codes are Aeropay-side declines returned at transaction-create time, before anything reaches the ACH network.
