http_semantics: 'Aeropay opens its own glossary with "NOTE: All Aeropay errors return with an HTTP 200 response."
  The per-operation error glossaries in the API reference do assign an HTTP status to each code, and the majority
  of the AP1XX-AP5XX business codes are marked 200 there while the AP00X authentication codes and the parameter
  codes AP700/AP701 are marked 401 and 400. An integrator MUST parse the body; branching on the HTTP status alone
  will read a declined payment, an insufficient-funds rejection and a suspended user as successes.'
