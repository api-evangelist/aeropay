- code: AP1300
  group: Refunds (AP13XX)
  meaning: Transaction already refunded
  resolution: The full transaction amount has already been covered by reversals (queued and/or processed) against
    this transaction - summed across all of them, not just one. No further refund is needed; partial refunds for
    the remaining, uncovered amount are still allowed.
  message: 'Transaction #{transaction\_id} has already been refunded by Transaction #{reversal\_transaction\_id}'
