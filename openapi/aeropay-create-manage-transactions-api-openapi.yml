openapi: 3.2.0
info:
  title: Aeropay v2 Create & Manage Transactions API
  version: 1.0.0
  description: '# Introduction


    Welcome to the Aeropay developer API documentation.'
servers:
- url: https://api.sandbox-pay.aero.inc
  variables: {}
tags:
- name: Create & Manage Transactions
paths:
  /v2/transaction:
    parameters: []
    post:
      summary: transaction
      description: 'Create an Aeropay Transaction Object where funds will move from a user to a merchant.


        The `userForMerchant` token specifies the paying user. The merchant being paid is specified by the `merchantId` in the request body. The user''s default bank account will be selected if no `bankAccountId` is specified.


        **Attributes** are AeroPay formatted data that you may wish to include with your transaction. For example, an invoice number or the tracking of a tip amount.


        **NOTE:** Tip amounts will be added to the ''amount'' value.


        Error Glossary (click to expand)


        | Code | HTTP Status | Message |

        |------|-------------|-------------|

        | `AP101` | 401 | No authenticated user |

        | `AP103` | 200 | Unable to set user reputation level |

        | `AP109` | 200 | Delinquent activity on account |

        | `AP110` | 200 | User profile incomplete |

        | `AP114` | 200 | Account restricted by merchant |

        | `AP201` | 200 | No merchant found for merchant id |

        | `AP203` | 200 | Unable to get location for merchant |

        | `AP205` | 200 | Unable to get rewards and fees for merchant |

        | `AP206` | 200 | Unable to get merchant account |

        | `AP300` | 200 | Unable to connect to bank |

        | `AP302` | 200 | Insufficient funds |

        | `AP303` | 200 | Transaction missing location |

        | `AP304` | 200 | Transaction amount exceeds limit |

        | `AP306` | 200 | Insufficient balance |

        | `AP307` | 200 | Payment declined - try a lower amount |

        | `AP308` | 200 | Invalid amount |

        | `AP314` | 200 | Transaction already exists |

        | `AP315` | 200 | Payment rejected - threshold or suspended bank |

        | `AP400` | 200 | No bank account linked |

        | `AP401` | 400 | Cannot validate bank account |

        | `AP402` | 200 | No bank account for merchant |

        | `AP403` | 200 | Bank not supported |

        | `AP404` | 200 | Invalid routing number |

        | `AP411` | 200 | Invalid account type - connect a checking account |

        | `AP412` | 200 | Bank account already removed |

        | `AP700` | 400 | Missing or invalid required parameter |

        | `AP701` | 400 | Improperly formatted parameter |

        | `AP1400` | 400 | Idempotency key reused with different payload |

        | `AP1401` | 400 | Request with same idempotency key still processing |

        | `AP1402` | 400 | Invalid idempotency key structure |'
      tags:
      - Create & Manage Transactions
      parameters:
      - name: Content-Type
        in: header
        required: true
        example: application/json
        schema:
          type: string
      - name: authorization
        in: header
        required: true
        description: A userForMerchant scoped token.
        example: Bearer {{userForMerchantScopedToken}}
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional UUID value to ensure idempotent transaction.
        example: 123e4567-e89b-12d3-a456-426614174000
        schema:
          type: string
          format: uuid
      requestBody:
        description: Body of transaction call
        content:
          application/json:
            schema:
              title: transactionRequest
              type: object
              required:
              - merchantId
              - amount
              properties:
                bankAccountId:
                  type: integer
                  description: default bank account for the user will be used if not specified
                merchantId:
                  type: integer
                  description: MerchantId
                amount:
                  type: object
                  description: Dictionary with currency and amount in pennies. Only USD supported at this time
                  properties:
                    amount:
                      type: integer
                      description: Payment amount in pennies
                    currency:
                      type: string
                      description: Currency. Currently only supports USD
                referenceId:
                  type: string
                  description: Merchant reference id of transaction
                attributes:
                  type: object
                  description: Dictionary with attributes. Tip and invoice are standard formats. Custom attributes must follow value/description dictionary formatting.
                  properties:
                    CUSTOM ATTRIBUTE:
                      type: object
                      properties:
                        value:
                          type: string
                          description: Value identifier of custom attribute
                        description:
                          type: string
                          description: Description of custom attribute
                    invoice:
                      type: object
                      properties:
                        value:
                          type: string
                          description: Value identifier of invoice
                          example: Value
                        description:
                          type: string
                          description: Description of invoice
                          example: Description
                    tip:
                      type: object
                      properties:
                        tipAmount:
                          type: string
                          description: Required. Amount of tip, in format XX.XX
                        label:
                          type: string
                          description: Required. String representation of tip, including $
                        totalAmount:
                          type: string
                          description: Required. Amount + tip, in format XX.XX. This can be used for reconciliation and to guarantee accurate amount value
                      example:
                        tipAmount: '1.00'
                        label: $1.00
                        totalAmount: '2.00'
        required: true
      responses:
        '200':
          headers:
            Date:
              schema:
                type: string
              example: Wed, 30 Jul 2025 13:07:17 GMT
            Content-Type:
              schema:
                type: string
              example: application/json
          description: Success or Business Logic Error
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/transactionResponse'
                - $ref: '#/components/schemas/200failure'
              examples:
                Success_With_Reference:
                  summary: Success - with referenceId
                  value:
                    transaction:
                      id: f79c19d4-11fd-408e-940f-c341667563b9
                      amount:
                        amount: 400
                        currency: USD
                      status: pending
                      paymentType: payment
                      userId: 2ac82269-9315-4bb6-8a19-f37e20d50238
                      referenceId: merchant-ref-id
                      attributes:
                        ATTRIBUTE NAME:
                          value: ATTRIBUTE VALUE
                          description: ATTRIBUTE DESCRIPTION
                        tip:
                          selection:
                            tipAmount: 1
                            label: $0.01
                            totalAmount: '4.00'
                      isRtp: false
                      merchantId: 582
                      title: Online Transaction
                      locationId: 541
                      userAccountId: 1139036
                Success_Minimal:
                  summary: Success - no referenceId or tip
                  value:
                    transaction:
                      id: f79c19d4-11fd-408e-940f-c341667563b9
                      amount:
                        amount: 400
                        currency: USD
                      status: pending
                      paymentType: payment
                      userId: 2ac82269-9315-4bb6-8a19-f37e20d50238
                      isRtp: false
                      merchantId: 582
                      title: Online Transaction
                      locationId: 541
                      userAccountId: 1139036
                Success_ValidTip_NoReferenceID:
                  summary: Success - valid tip
                  value:
                    transaction:
                      id: f79c19d4-11fd-408e-940f-c341667563b9
                      amount:
                        amount: 400
                        currency: USD
                      status: pending
                      paymentType: payment
                      userId: 2ac82269-9315-4bb6-8a19-f37e20d50238
                      attributes:
                        ATTRIBUTE NAME:
                          value: ATTRIBUTE VALUE
                          description: ATTRIBUTE DESCRIPTION
                        tip:
                          selection:
                            tipAmount: 1
                            label: $0.01
                            totalAmount: '4.00'
                      isRtp: false
                      merchantId: 582
                      title: Online Transaction
                      locationId: 541
                      userAccountId: 1139036
                Error_InvalidTipCalculation:
                  summary: Fail - Invalid total tip amount
                  value:
                    error:
                      code: ApError
                      message: 'Invalid total amount calculation: 13.34 not 1.03'
        '400':
          description: Bad Request - Validation Errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              examples:
                Error_InvalidAmountFormat:
                  summary: Fail - Invalid amount format
                  value:
                    error:
                      code: AP701
                      message: 'Improperly formatted parameter: [''amount: money amount must be a dictionary'']'
                Error_InvalidReference:
                  summary: Fail - invalid referenceId (>64)
                  value:
                    error:
                      code: AP701
                      message: 'Improperly formatted parameter: [''referenceId: exceeded maximum length of 64'']'
                Error_MissingCurrency:
                  summary: Fail - Missing amount/currency
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Currency is required
      operationId: postV2Transaction
      x-operation-id-source: derived
  /v2/transaction/{transactionUUID}/refunds:
    parameters:
    - name: transactionUUID
      in: path
      required: true
      description: Transaction UUID (id returned from POST /v2/transaction)
      schema:
        type: string
        format: uuid
    get:
      summary: transactionRefunds
      description: 'Retrieve the current refund state for a specific transaction.


        Returns two arrays:

        - **`refunds`** — processed or pending reversal transactions. Shape matches a standard transaction object. Always present; empty when no refunds have been processed.

        - **`queuedRefunds`** — individually tracked refunds that have been requested but not yet processed (e.g. the original transaction has not yet cleared). Each item has `id`, `referenceId`, `amount` (with `amount` and `currency`), and `status` (`queued` or `abandoned`). Always present; empty when nothing is queued.


        The `id` on a queued refund item is the uuid assigned at the time POST /v2/reverseTransaction was called (either supplied by the client or system-generated). That same uuid becomes the `id` of the resulting reversal transaction once processed.


        **Multiple reversals:** A transaction can have more than one independent reversal. Each POST /v2/reverseTransaction call produces its own record. Both `refunds` and `queuedRefunds` may contain multiple entries.


        Error Glossary (click to expand)


        | Code | HTTP Status | Message |

        |------|-------------|---------|

        | `AP011` | 401 | Unauthorized |

        | `AP101` | 401 | No authenticated user |

        | `AP700` | 400 | Missing or invalid required parameter |

        | `AP701` | 400 | Improperly formatted parameter |'
      tags:
      - Create & Manage Transactions
      parameters:
      - name: Content-Type
        in: header
        required: false
        example: application/json
        schema:
          type: string
      - name: authorization
        in: header
        required: true
        description: A userForMerchant scoped token.
        example: Bearer {{userForMerchantScopedToken}}
        schema:
          type: string
      responses:
        '200':
          headers:
            Date:
              schema:
                type: string
              example: Mon, 22 Jan 2026 10:30:00 GMT
            Content-Type:
              schema:
                type: string
              example: application/json
          description: Success - Transaction refunds retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transactionRefundsResponse'
              examples:
                hasRefunds:
                  summary: Transaction has processed/pending refunds
                  value:
                    refunds:
                    - id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                      amount:
                        amount: 5000
                        currency: USD
                      status: processed
                      paymentType: reversal
                      userId: 2ac82269-9315-4bb6-8a19-f37e20d50238
                      title: Refund for Online Transaction
                      referenceId: 0123456789
                      attributes: []
                      createdDate: '2026-01-22T10:30:00+00:00'
                      modifiedDate: '2026-01-22T10:30:00+00:00'
                      apFee: '0.00'
                      isRtp: false
                      merchantId: 582
                      locationId: 541
                      userAccountId: 1139036
                    - id: b2c3c3d4-e5f6-7890-abcd-ef1234567890
                      amount:
                        amount: 1000
                        currency: USD
                      status: pending
                      paymentType: reversal
                      userId: 2ac82269-9315-4bb6-8a19-f37e20d50238
                      title: Refund for Online Transaction
                      referenceId: 0123456789
                      attributes: []
                      createdDate: '2026-01-24T10:30:00+00:00'
                      modifiedDate: '2026-01-24T10:30:00+00:00'
                      apFee: '0.00'
                      isRtp: false
                      merchantId: 582
                      locationId: 541
                      userAccountId: 1139036
                    queuedRefunds: []
                hasQueuedRefunds:
                  summary: Transaction has queued refunds pending processing
                  value:
                    refunds: []
                    queuedRefunds:
                    - id: a3f1c2d4-e5b6-7890-abcd-ef1234567890
                      referenceId: b4e2d3f5-f6c7-8901-bcde-fa2345678901
                      amount:
                        amount: 1500
                        currency: USD
                      status: queued
                    - id: c5d3e4f6-a7b8-9012-cdef-ab3456789012
                      referenceId: null
                      amount:
                        amount: 500
                        currency: USD
                      status: queued
                noRefunds:
                  summary: Transaction has no refunds
                  value:
                    refunds: []
                    queuedRefunds: []
      operationId: getV2TransactionByTransactionUUIDRefunds
      x-operation-id-source: derived
  /v2/transaction/idempotency/{idempotencyKey}:
    parameters:
    - name: idempotencyKey
      in: path
      required: true
      description: Idempotency key UUID sent as the Idempotency-Key header on the original POST /v2/transaction request
      schema:
        type: string
        format: uuid
    get:
      summary: getTransactionByIdempotencyKey
      description: 'Fetches the original transaction response by the idempotency key used during the POST /v2/transaction request.


        **Security Behavior**


        To prevent information leakage, this endpoint returns an empty object `{}` in all negative cases — including when the idempotency key does not exist and when the key exists but belongs to a different merchant. Callers cannot distinguish between the two scenarios.


        **Loss of Reference Behavior**


        The idempotency key can reference the transaction only until the TTL expires. The current TTL is 1 day. After that, the transaction may exist but cannot be retrieved by the idempotency key.'
      tags:
      - Create & Manage Transactions
      parameters:
      - name: Content-Type
        in: header
        required: false
        example: application/json
        schema:
          type: string
      - name: authorization
        in: header
        required: false
        description: A merchant scoped token.
        example: Bearer {{merchantScopedToken}}
        schema:
          type: string
      responses:
        '200':
          headers:
            Date:
              schema:
                type: string
              example: Tue, 24 Jun 2025 20:24:21 GMT
            Content-Type:
              schema:
                type: string
              example: application/json
          description: Returns the transaction response originally stored for this idempotency key, or an empty object if no record is found or the key belongs to a different merchant.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/transactionGetResponse'
                - $ref: '#/components/schemas/emptyResponse'
              examples:
                found:
                  summary: Idempotency key found — returns original transaction response
                  value:
                    transaction:
                      id: f79c19d4-11fd-408e-940f-c341667563b9
                      amount:
                        amount: 400
                        currency: USD
                      status: pending
                      paymentType: payment+
                      userId: 2ac82269-9315-4bb6-8a19-f37e20d50238
                      title: Online Transaction
                      referenceId: 0123456789
                      attributes:
                      - value: '1'
                        name: tip
                        description: flat
                      - value: ATTRIBUTE VALUE
                        name: ATTRIBUTE NAME
                        description: ATTRIBUTE DESCRIPTION
                      createdDate: '2026-01-21T02:14:45+00:00'
                      modifiedDate: '2026-01-21T02:14:45+00:00'
                      apFee: '0.03'
                      isRtp: false
                      merchantId: 582
                      locationId: 541
                      userAccountId: 1139036
                notFound:
                  summary: Idempotency key not found or belongs to a different merchant
                  value: {}
        '400':
          description: Missing or invalid idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/200failure'
              example:
                error:
                  help: contact support@aeropay.com for help
                  code: AP700
                  message: 'Missing required Parameter: ''idempotencyKey'''
      operationId: getV2TransactionIdempotencyByIdempotencyKey
      x-operation-id-source: derived
  /v2/transaction/{transactionId}:
    parameters:
    - name: transactionId
      in: path
      required: true
      description: Transaction Id of transaction. In UUID format.
      example: 47e1eab8-5b71-42e7-a0fd-bf30f73af6fb
      schema:
        type: string
    get:
      summary: transaction
      description: 'Fetch a transaction for the specified transaction id.


        To search for multiple transactions or by other transaction attributes, use `POST /v2/transactionSearch`.


        Error Glossary (click to expand)


        | Code | HTTP Status | Message |

        |------|-------------|-------------|

        | `AP011` | 401 | Unauthorized for this transaction |

        | `AP101` | 401 | No authenticated user |

        | `AP700` | 400 | Missing or invalid required parameter |

        | `AP701` | 400 | Improperly formatted parameter |'
      tags:
      - Create & Manage Transactions
      parameters:
      - name: Content-Type
        in: header
        required: true
        example: application/json
        schema:
          type: string
      - name: authorization
        in: header
        required: true
        description: A merchant scoped token.
        example: Bearer {{merchantScopedToken}}
        schema:
          type: string
      responses:
        '200':
          headers:
            Date:
              schema:
                type: string
              example: Thu, 07 Aug 2025 14:22:24 GMT
            Content-Type:
              schema:
                type: string
              example: application/json
          description: Success or Transaction Not Found
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/transactionGetResponse'
                - $ref: '#/components/schemas/200failure'
              examples:
                Success_V2_Reference:
                  summary: Success - V2 referenceId
                  value:
                    transaction:
                      id: f79c19d4-11fd-408e-940f-c341667563b9
                      amount:
                        amount: 400
                        currency: USD
                      status: pending
                      paymentType: payment
                      userId: 2ac82269-9315-4bb6-8a19-f37e20d50238
                      referenceId: merchant-ref-id
                      attributes:
                        ATTRIBUTE NAME:
                          value: ATTRIBUTE VALUE
                          description: ATTRIBUTE DESCRIPTION
                        tip:
                          selection:
                            tipAmount: 1
                            label: $0.01
                            totalAmount: '4.00'
                      isRtp: false
                      createdDate: '2026-01-02T11:45:32+00:00'
                      modifiedDate: '2026-01-02T11:45:32+00:00'
                      apFee: '0.03'
                      merchantId: 582
                      title: Online Transaction
                      locationId: 541
                      userAccountId: 1139036
                Success_V2_NoReference:
                  summary: Success - V2 no referenceId
                  value:
                    transaction:
                      id: 5c10f370-387a-4aa0-8f94-56fecc4b0d84
                      amount:
                        amount: 3
                        currency: USD
                      status: pending
                      paymentType: payment
                      userId: '2181'
                      title: Online Transaction
                      attributes:
                      - value: ATTRIBUTE VALUE
                        name: ATTRIBUTE NAME
                        description: ATTRIBUTE DESCRIPTION
                      createdDate: '2025-12-24T01:52:42+00:00'
                      modifiedDate: '2025-12-24T01:52:42+00:00'
                      apFee: '0.00'
                      isRtp: false
                      merchantId: 1057
                      locationId: 1147
                      userAccountId: 4542
                Error_NotFound:
                  summary: Fail - Invalid transaction UUID
                  value:
                    error:
                      code: ApError
                      message: Transaction 47e1eab8-5b71-42e7-a0fd-bf30f73af6fa not found
      operationId: getV2TransactionByTransactionId
      x-operation-id-source: derived
  /v2/preauthTransaction:
    parameters: []
    post:
      summary: preauthTransaction
      description: 'Create a preauthorized transaction for the user specified by the authorization token.


        The response contains a transaction object. The `id` within this transaction object is used to identify this preauthorized transaction.


        Preauthorized transactions do not have a default expiration, but can be configurable by merchant.


        Error Glossary (click to expand)


        | Code | HTTP Status | Message |

        |------|-------------|-------------|

        | `AP009` | 401 | Unauthorized |

        | `AP101` | 401 | No authenticated user |

        | `AP103` | 200 | Unable to set user reputation level |

        | `AP109` | 200 | Delinquent activity on account |

        | `AP110` | 200 | User profile incomplete |

        | `AP201` | 200 | No merchant found for merchant id |

        | `AP203` | 200 | Unable to get location for merchant |

        | `AP205` | 200 | Unable to get rewards and fees for merchant |

        | `AP300` | 200 | Unable to connect to bank |

        | `AP302` | 200 | Insufficient funds |

        | `AP303` | 200 | Transaction missing location |

        | `AP304` | 200 | Transaction amount exceeds limit |

        | `AP306` | 200 | Insufficient balance |

        | `AP307` | 200 | Payment declined - try a lower amount |

        | `AP308` | 200 | Invalid amount |

        | `AP310` | 200 | Credit transaction declined |

        | `AP314` | 200 | Transaction already exists |

        | `AP315` | 200 | Payment rejected - threshold or suspended bank |

        | `AP400` | 200 | No bank account linked |

        | `AP401` | 400 | Cannot validate bank account |

        | `AP402` | 200 | No bank account for merchant |

        | `AP403` | 200 | Bank not supported |

        | `AP411` | 200 | Invalid account type - connect a checking account |

        | `AP412` | 200 | Bank account already removed |

        | `AP700` | 400 | Missing or invalid required parameter |

        | `AP701` | 400 | Improperly formatted parameter |

        | `AP1000` | 200 | Invalid API |

        | `AP1400` | 400 | Idempotency key reused with different payload |

        | `AP1401` | 400 | Request with same idempotency key still processing |

        | `AP1402` | 400 | Invalid idempotency key structure |'
      tags:
      - Create & Manage Transactions
      parameters:
      - name: Content-Type
        in: header
        required: true
        example: application/json
        schema:
          type: string
      - name: authorization
        in: header
        required: true
        description: A userForMerchant scoped token.
        example: Bearer {{userForMerchantScopedToken}}
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional UUID value to ensure idempotent transaction.
        example: 123e4567-e89b-12d3-a456-426614174000
        schema:
          type: string
          format: uuid
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              title: preauthtransactionRequest
              description: Body of preauthtransaction call
              type: object
              required:
              - bankAccountId
              - merchantId
              - amount
              properties:
                bankAccountId:
                  type: integer
                  description: bankAccountId of selected bank
                merchantId:
                  type: integer
                  description: MerchantId
                amount:
                  type: object
                  description: Dictionary with currency and amount in pennies. Only USD supported at this time
                  properties:
                    amount:
                      type: integer
                      description: Payment amount in pennies
                    currency:
                      type: string
                      description: Currency. Currently only supports USD
                attributes:
                  type: object
                  description: Dictionary with attributes. Tip and invoice are standard formats. Custom attributes must follow value/description dictionary formatting.
                  properties:
                    CUSTOM ATTRIBUTE:
                      type: object
                      properties:
                        value:
                          type: string
                          description: Value identifier of custom attribute
                        description:
                          type: string
                          description: Description of custom attribute
                    invoice:
                      type: object
                      properties:
                        value:
                          type: string
                          description: Value identifier of invoice
                          example: Value
                        description:
                          type: string
                          description: Description of invoice
                          example: Description
                    tip:
                      type: object
                      properties:
                        tipAmount:
                          type: string
                          description: Required. Amount of tip, in format XX.XX
                        label:
                          type: string
                          description: Required. String representation of tip, including $
                        totalAmount:
                          type: string
                          description: Required. Amount + tip, in format XX.XX. This can be used for reconciliation and to guarantee accurate amount value
                      example:
                        tipAmount: '1.00'
                        label: $1.00
                        totalAmount: '2.00'
                referenceId:
                  type: string
                  description: Merchant reference id of transaction
              example:
                bankAccountId: '0'
                merchantId: '1748'
                amount:
                  amount: 1234
                  currency: USD
                referenceId: 123-123-1234
        required: true
      responses:
        '200':
          headers:
            Date:
              schema:
                type: string
              example: Wed, 30 Jul 2025 16:28:20 GMT
            Content-Type:
              schema:
                type: string
              example: application/json
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/preauthTransactionResponse'
                - $ref: '#/components/schemas/200failure'
              examples:
                Success_V2_NoReference:
                  summary: Success - V2 no referenceId
                  value:
                    transaction:
                      id: bec5a7b7-edd8-4580-aff5-b1ee52e73686
                      amount:
                        currency: USD
                        amount: 222
                      status: live
                      userId: d5e17cbf-92ad-44e7-b483-19dba7adaaa4
                      description: Online Transaction
                      attributes:
                        key:
                          value: KEY VALUE
                          description: KEY DESCRIPTION
                      createdDate: '2026-01-02T11:59:44+00:00'
                      expiryDate: '2026-01-04T11:59:44+00:00'
                      userName: Begos Andres
                      userEmail: begona.andresm@aeropay.com
                      merchantId: 1057
                      userAccountId: 1717
                      locationId: 1147
                Success_V2_ValidReference:
                  summary: Success - V2 valid referenceId
