    queuedRefundItem:
      title: Queued refund item
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID4 assigned to this queued refund at creation. Will become the aeroTransaction.id when the queued refund is processed.
        referenceId:
          type:
          - string
          - 'null'
          description: Merchant-provided reference supplied at the time POST /v2/reverseTransaction was called. null if none was provided. Stored as a transaction attribute when processed.
        amount:
          type: object
          properties:
            amount:
              type: integer
              description: Queued refund amount in cents
            currency:
              type: string
              description: Currency code (e.g., USD)
        status:
          type: string
          description: Current state of this queued refund entry. 'queued' means it is pending processing. 'abandoned' means it was superseded or cancelled before processing.
          enum:
          - queued
          - abandoned
      example:
        id: a3f1c2d4-e5b6-7890-abcd-ef1234567890
        referenceId: b4e2d3f5-f6c7-8901-bcde-fa2345678901
        amount:
          amount: 1500
          currency: USD
        status: queued
    transactionRefundsResponse:
      title: Get transaction refunds Response
      type: object
      properties:
        refunds:
          type: array
          description: List of processed or pending refunds for the transaction. Empty array when only queued refunds exist.
          items:
            $ref: '#/components/schemas/transactionGetResponse'
        queuedRefunds:
          type: array
          description: List of individually tracked refunds that have been requested but not yet processed. Each item carries its own id, referenceId, amount, and status. Empty array when no queued refunds exist.
          items:
            $ref: '#/components/schemas/queuedRefundItem'
      example:
        refunds:
        - id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          amount:
            amount: 5000
            currency: USD
          status: processed
          paymentType: reversal
          userId: 2ac82269-9315-4bb6-8a19-f37e20d50238
          title: Refund for Online Transaction
          referenceId: 0123456789
          attributes: []
          createdDate: '2026-01-22T10:30:00+00:00'
          modifiedDate: '2026-01-22T10:30:00+00:00'
          apFee: '0.00'
          isRtp: false
          merchantId: 582
