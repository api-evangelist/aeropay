                Error_TransactionNotFound:
                  summary: Fail - Transaction not found
                  value:
                    error:
                      code: AP316
                      message: Transaction ea89bec0-0edb-4f86-9a92-66ce29a488f3 not found
        '400':
          description: Bad Request - Validation Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
