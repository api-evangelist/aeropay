        | `AP1104` | 400 | Unrecognized topic |

        | `AP1105` | 200 | Error creating webhook |

        | `AP1107` | 400 | Merchant is required |


        </details>'
      tags:
      - Webhooks
      parameters:
      - name: Content-Type
        in: header
        required: true
        example: application/json
        schema:
          type: string
      - name: authorization
        in: header
