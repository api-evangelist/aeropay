                Error_Invalid_Amount:
                  summary: Fail - Invalid Amount
                  value:
                    error:
                      code: AP701
                      message: 'Improperly formatted parameter: [''amount: money amount must be a dictionary'']'
        '400':
          description: Bad Request
          content:
